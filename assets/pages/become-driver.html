<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Joldo - Айдоочу болуу</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="../styles/auth.css">
    <link rel="stylesheet" href="../styles/index.css">
</head>
<body>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <header>
        <nav class="navbar lg:navbar-expand bg-1 fg-2" data-bs-theme="dark">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center py-0" href="../../index.html" id="joldo-logo">
                    <img src="../img/joldo-logo.svg" alt="Joldo">
                </a>
                <dialog class="drawer drawer-start" tabindex="-1" id="navbarLeftDrawer" aria-labelledby="navbarLeftDrawerLabel">
                    <div class="drawer-header">
                        <h5 class="drawer-title" id="navbarLeftDrawerLabel">Меню</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                    </div>
                </dialog>
                <div class="div-btn-auth">
                    <button type="button" class="btn">
                        <a href="../pages/authorization.html">Кирүү</a>
                    </button>
                </div>
                <button class="btn-icon" type="button" data-bs-toggle="menu" aria-expanded="false">
                    <img src="../img/kg.png" alt="" width="30px">
                </button>
                <div class="menu">
                    <a class="menu-item" href="../pages/become-driver-ru.html">
                        <img src="../img/ru.png" alt="" width="20px">
                    </a>
                    <a class="menu-item" href="../pages/become-driver-en.html">
                        <img src="../img/us.png" alt="" width="20px">
                    </a>
                </div>
                <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarLeftDrawer" aria-controls="navbarLeftDrawer" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon" aria-hidden="true"></span>
                </button>
            </div>
        </nav>
    </header>
    <main class="reg-row row">
        <div class="col-12 lg:col-6 reg-hero reg-hero-driver">
            <h1 class="reg-hero-title">Joldo менен акча табыңыз</h1>
            <p class="reg-hero-text">
                Айдоочу болуңуз, сапардын баасын өзүңүз белгилеңиз жана өзүңүзгө ыңгайлуу убакытта иштеңиз.
            </p>
        </div>
        <div class="col-12 lg:col-6 reg-form-col">
            <form class="reg-form" action="#" method="post" enctype="multipart/form-data">
                <h2 class="reg-title">Айдоочу болуңуз</h2>
                <p class="reg-sub">Анкетаны толтуруңуз, биз сиз менен ырастоо үчүн байланышабыз.</p>
                <div class="reg-two">
                    <div class="reg-field">
                        <label class="reg-label" for="d-name">Аты</label>
                        <input class="reg-input" type="text" id="d-name" name="name" placeholder="Сиздин атыңыз" required>
                    </div>
                    <div class="reg-field">
                        <label class="reg-label" for="d-surname">Фамилиясы</label>
                        <input class="reg-input" type="text" id="d-surname" name="surname" placeholder="Сиздин фамилияңыз" required>
                    </div>
                </div>
                <div class="reg-field">
                    <label class="reg-label" for="d-phone">Телефон номери</label>
                    <svg class="reg-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="none" stroke="#9aa4ae" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>
                    </svg>
                    <input class="reg-input reg-input-icon" type="tel" id="d-phone" name="phone" placeholder="+996 XXX XXX XXX" required>
                </div>
                <div class="reg-field">
                    <label class="reg-label" for="d-city">Шаары</label>
                    <input class="reg-input" type="text" id="d-city" name="city" placeholder="Мисалы, Бишкек" required>
                </div>
                <div class="reg-field">
                    <label class="reg-label" for="d-city">ИНН</label>
                    <input class="reg-input" type="text" id="d-city" name="city" placeholder="ИНН" required>
                </div>
                <div class="reg-field">
                    <label class="reg-label" for="d-license">Айдоочулук күбөлүктүн сүрөтү, такси лицензиясы, 083 маалымкат</label>
                    <input class="reg-input reg-file" type="file" id="d-license" name="license" accept="image/*" required multiple>
                    <p class="reg-hint">JPG же PNG форматы. Маалыматтарды бизден башка эч ким көрбөйт.</p>
                </div>
                <button type="submit" class="reg-btn">Өтүнмө жөнөтүү</button>
                <p class="reg-login">Аккаунтуңуз барбы? <a href="../pages/login.html">Кирүү</a></p>
            </form>
        </div>
    </main>
</body>
</html>
